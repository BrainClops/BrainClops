<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="About me" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .red  { fill: #9E1B1E; }
    .ink  { fill: #2B0F0C; }
    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 0.8s; } .d4 { animation-delay: 1.1s; }
    .d5 { animation-delay: 1.4s; } .d6 { animation-delay: 1.7s; }
    .line { stroke: #9E1B1E; stroke-width: 3; stroke-dasharray: 600; stroke-dashoffset: 600;
            animation: draw 1.6s ease-out 0.3s forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
  </style>

  <!-- background -->
  <rect width="1000" height="560" rx="18" fill="#EBD2B0"/>

  <!-- top corners -->
  <text x="48" y="58" class="sans red fade d1" font-size="15" font-weight="700" letter-spacing="1">@BrainClops</text>
  <text x="952" y="58" text-anchor="end" class="sans red fade d1" font-size="14" font-weight="700" letter-spacing="3">PORTFOLIO 2026</text>

  <!-- decorative vertical lines -->
  <line class="line" x1="352" y1="0" x2="352" y2="175"/>
  <line class="line" x1="105" y1="382" x2="105" y2="480"/>

  <!-- giant title -->
  <text x="46" y="255" class="sans red fade d2" font-size="150" font-weight="800" textLength="440" lengthAdjust="spacingAndGlyphs">about</text>
  <text x="46" y="372" class="sans red fade d3" font-size="150" font-weight="800" textLength="265" lengthAdjust="spacingAndGlyphs">me.</text>

  <!-- right column -->
  <text x="575" y="150" class="sans ink fade d4" font-size="34" font-weight="800" letter-spacing="-1">nice to meet you!</text>
  <g class="sans ink fade d5" font-size="14.5" font-weight="500">
    <text x="575" y="196">I am Rohit, an aspiring data scientist who turns</text>
    <text x="575" y="219">raw, disorderly data into decisions of consequence.</text>
    <text x="575" y="242">My work spans data engineering, automation and</text>
    <text x="575" y="265">applied machine learning: from retail ETL pipelines</text>
    <text x="575" y="288">and enterprise invoice intelligence to civic-tech</text>
    <text x="575" y="311">platforms that carry a citizen's voice straight to</text>
    <text x="575" y="334">the authorities who must answer it.</text>
    <text x="575" y="372">To me, analysis is never mere arithmetic; it is the</text>
    <text x="575" y="395">pursuit of clarity, accountability and the lasting</text>
    <text x="575" y="418">impression a well-engineered insight leaves behind.</text>
  </g>

  <!-- signature + tagline -->
  <text x="48" y="528" class="sans red fade d6" font-size="44" font-weight="800" letter-spacing="-1">~ Rohit</text>
  <text x="952" y="518" text-anchor="end" class="sans red fade d6" font-size="15" font-weight="500">Data, decoded into decisions.</text>
  <text x="952" y="538" text-anchor="end" class="sans red fade d6" font-size="13" font-weight="500" opacity="0.8">Build with purpose. Analyse with rigour.</text>
</svg>
