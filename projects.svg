<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-label="Selected projects" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .sans { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .red  { fill: #9E1B1E; }
    .ink  { fill: #2B0F0C; }
    .fade { opacity: 0; animation: fadeUp 0.9s ease-out forwards; }
    .d1 { animation-delay: 0.2s; } .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 0.9s; } .d4 { animation-delay: 1.2s; }
    .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
    .d7 { animation-delay: 2.1s; }
    .line  { stroke: #9E1B1E; stroke-width: 3; stroke-dasharray: 600; stroke-dashoffset: 600;
             animation: draw 1.6s ease-out 0.3s forwards; }
    .rule  { stroke: #9E1B1E; stroke-width: 2; stroke-dasharray: 960; stroke-dashoffset: 960;
             animation: draw 1.4s ease-out forwards; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes draw   { to { stroke-dashoffset: 0; } }
  </style>

  <!-- background -->
  <rect width="1000" height="850" rx="18" fill="#EBD2B0"/>

  <!-- top corners -->
  <text x="48" y="58" class="sans red fade d1" font-size="15" font-weight="700" letter-spacing="1">@BrainClops</text>
  <text x="952" y="58" text-anchor="end" class="sans red fade d1" font-size="14" font-weight="700" letter-spacing="3">SELECTED WORK</text>

  <!-- title -->
  <line class="line" x1="300" y1="0" x2="300" y2="128"/>
  <text x="46" y="205" class="sans red fade d2" font-size="105" font-weight="800" textLength="590" lengthAdjust="spacingAndGlyphs">projects.</text>
  <g class="sans ink fade d3" font-size="14.5" font-weight="500">
    <text x="720" y="150">Selected work across data</text>
    <text x="720" y="173">engineering, automation and</text>
    <text x="720" y="196">civic technology, built to</text>
    <text x="720" y="219">solve problems that matter.</text>
  </g>

  <!-- 01 -->
  <line class="rule" x1="48" y1="270" x2="952" y2="270" style="animation-delay:0.8s"/>
  <g class="fade d3">
    <text x="48" y="345" class="sans red" font-size="56" font-weight="800" letter-spacing="-2">01</text>
    <text x="160" y="320" class="sans ink" font-size="28" font-weight="800" letter-spacing="-0.5">Retail Data Pipeline</text>
    <text x="160" y="348" class="sans ink" font-size="14" font-weight="500">End-to-end ETL over Walmart retail data: extracts from SQL and</text>
    <text x="160" y="370" class="sans ink" font-size="14" font-weight="500">Parquet sources, transforms it, and loads analysis-ready tables.</text>
    <text x="952" y="320" text-anchor="end" class="sans red" font-size="12" font-weight="700" letter-spacing="1.5">PYTHON · SQL · PANDAS · PARQUET</text>
    <text x="952" y="342" text-anchor="end" class="sans ink" font-size="12" font-weight="600" letter-spacing="1.5" opacity="0.7">DATA ENGINEERING</text>
  </g>

  <!-- 02 -->
  <line class="rule" x1="48" y1="395" x2="952" y2="395" style="animation-delay:1.1s"/>
  <g class="fade d4">
    <text x="48" y="470" class="sans red" font-size="56" font-weight="800" letter-spacing="-2">02</text>
    <text x="160" y="445" class="sans ink" font-size="28" font-weight="800" letter-spacing="-0.5">LedgerLens: Invoice Automation</text>
    <text x="160" y="473" class="sans ink" font-size="14" font-weight="500">Invoice and document automation for enterprise finance teams,</text>
    <text x="160" y="495" class="sans ink" font-size="14" font-weight="500">built for Grevix AfterCode 2026 to eliminate manual data entry.</text>
    <text x="952" y="445" text-anchor="end" class="sans red" font-size="12" font-weight="700" letter-spacing="1.5">PYTHON</text>
    <text x="952" y="467" text-anchor="end" class="sans ink" font-size="12" font-weight="600" letter-spacing="1.5" opacity="0.7">AUTOMATION · HACKATHON</text>
  </g>

  <!-- 03 -->
  <line class="rule" x1="48" y1="520" x2="952" y2="520" style="animation-delay:1.4s"/>
  <g class="fade d5">
    <text x="48" y="595" class="sans red" font-size="56" font-weight="800" letter-spacing="-2">03</text>
    <text x="160" y="570" class="sans ink" font-size="28" font-weight="800" letter-spacing="-0.5">Public Grievance Portal</text>
    <text x="160" y="598" class="sans ink" font-size="14" font-weight="500">A civic-tech platform where citizens report public problems and</text>
    <text x="160" y="620" class="sans ink" font-size="14" font-weight="500">complaints are routed straight to the concerned authority.</text>
    <text x="952" y="570" text-anchor="end" class="sans red" font-size="12" font-weight="700" letter-spacing="1.5">CIVIC TECH</text>
    <text x="952" y="592" text-anchor="end" class="sans ink" font-size="12" font-weight="600" letter-spacing="1.5" opacity="0.7">IN DEVELOPMENT</text>
  </g>

  <!-- 04 -->
  <line class="rule" x1="48" y1="645" x2="952" y2="645" style="animation-delay:1.7s"/>
  <g class="fade d6">
    <text x="48" y="720" class="sans red" font-size="56" font-weight="800" letter-spacing="-2">04</text>
    <text x="160" y="695" class="sans ink" font-size="28" font-weight="800" letter-spacing="-0.5">Clothing Classifier</text>
    <text x="160" y="723" class="sans ink" font-size="14" font-weight="500">A machine-learning model that classifies clothing images for</text>
    <text x="160" y="745" class="sans ink" font-size="14" font-weight="500">e-commerce use: automated tagging and catalogue organisation.</text>
    <text x="952" y="695" text-anchor="end" class="sans red" font-size="12" font-weight="700" letter-spacing="1.5">TENSORFLOW</text>
    <text x="952" y="717" text-anchor="end" class="sans ink" font-size="12" font-weight="600" letter-spacing="1.5" opacity="0.7">MACHINE LEARNING</text>
  </g>

  <!-- closing rule + footer -->
  <line class="rule" x1="48" y1="770" x2="952" y2="770" style="animation-delay:2s"/>
  <text x="48" y="822" class="sans red fade d7" font-size="40" font-weight="800" letter-spacing="-1">~ Rohit</text>
  <text x="952" y="812" text-anchor="end" class="sans red fade d7" font-size="15" font-weight="500">Build with purpose. Analyse with rigour.</text>
</svg>
